<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel - Lost & Found</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            <i class="fa-solid fa-magnifying-glass me-2"></i>
            Lost & Found
        </a>

        <div>
            <span class="text-white me-3">
                <i class="fa-solid fa-user-shield me-1"></i>
                Admin
            </span>

            <button
                class="btn btn-outline-light btn-sm"
                onclick="adminLogout()"
            >
                Logout
            </button>
        </div>

    </div>
</nav>


<div class="container py-5">

    <div class="mb-4">

        <h1 class="fw-bold">
            <i class="fa-solid fa-shield-halved me-2"></i>
            Admin Dashboard
        </h1>

        <p class="text-muted">
            Manage users, reports and claim requests
        </p>

    </div>


    <!-- STATISTICS -->

    <div class="row g-4 mb-5">

        <div class="col-md-3">
            <div class="card shadow-sm border-0 p-4">
                <h6 class="text-muted">Total Users</h6>
                <h2 id="adminUsers">0</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm border-0 p-4">
                <h6 class="text-muted">Total Items</h6>
                <h2 id="adminItems">0</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm border-0 p-4">
                <h6 class="text-muted">Pending Claims</h6>
                <h2 id="adminPending">0</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm border-0 p-4">
                <h6 class="text-muted">Returned Items</h6>
                <h2 id="adminReturned">0</h2>
            </div>
        </div>

    </div>


    <!-- CLAIMS -->

    <div class="card shadow-sm border-0">

        <div class="card-header bg-dark text-white py-3">

            <h4 class="mb-0">
                <i class="fa-solid fa-file-circle-check me-2"></i>
                Claim Requests
            </h4>

        </div>

        <div class="card-body">

            <div id="adminClaims">

                <div class="text-center py-5">

                    <i class="fa-solid fa-spinner fa-spin fa-2x"></i>

                    <p class="mt-3">
                        Loading claims...
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- DETAILS MODAL -->

<div
    class="modal fade"
    id="claimDetailsModal"
    tabindex="-1"
>

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Claim Details
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>

            </div>

            <div
                class="modal-body"
                id="claimDetails"
            ></div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/app.js"></script>

</body>
</html>
