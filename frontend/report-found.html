<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Report Found Item - Lost & Found</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<nav class="navbar navbar-expand-lg bg-white shadow-sm">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="index.html"
        >
            <i class="fa-solid fa-magnifying-glass-location me-2"></i>
            Lost & Found
        </a>


        <div>

            <a
                href="dashboard.html"
                class="btn btn-outline-primary me-2"
            >
                Dashboard
            </a>

            <button
                onclick="logoutUser()"
                class="btn btn-outline-danger"
            >
                Logout
            </button>

        </div>

    </div>

</nav>


<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-7">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <i class="fa-solid fa-hand-holding fa-3x mb-3"></i>

                        <h2 class="fw-bold">
                            Report Found Item
                        </h2>

                        <p class="text-muted">
                            Help someone get their lost item back.
                        </p>

                    </div>


                    <form
                        id="foundItemForm"
                        enctype="multipart/form-data"
                    >

                        <div class="mb-3">

                            <label
                                for="foundTitle"
                                class="form-label"
                            >
                                Item Name
                            </label>

                            <input
                                type="text"
                                id="foundTitle"
                                name="title"
                                class="form-control"
                                placeholder="e.g. Black Wallet"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="foundCategory"
                                class="form-label"
                            >
                                Category
                            </label>

                            <select
                                id="foundCategory"
                                name="category"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select category
                                </option>

                                <option value="Electronics">
                                    Electronics
                                </option>

                                <option value="Documents">
                                    Documents
                                </option>

                                <option value="Wallet">
                                    Wallet
                                </option>

                                <option value="Keys">
                                    Keys
                                </option>

                                <option value="Clothing">
                                    Clothing
                                </option>

                                <option value="Books">
                                    Books
                                </option>

                                <option value="Accessories">
                                    Accessories
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <div class="mb-3">

                            <label
                                for="foundDescription"
                                class="form-label"
                            >
                                Description
                            </label>

                            <textarea
                                id="foundDescription"
                                name="description"
                                class="form-control"
                                rows="4"
                                placeholder="Describe the item you found"
                            ></textarea>

                        </div>


                        <div class="mb-3">

                            <label
                                for="foundLocation"
                                class="form-label"
                            >
                                Found Location
                            </label>

                            <input
                                type="text"
                                id="foundLocation"
                                name="location"
                                class="form-control"
                                placeholder="e.g. Hostel 1"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="foundDate"
                                class="form-label"
                            >
                                Date Found
                            </label>

                            <input
                                type="date"
                                id="foundDate"
                                name="item_date"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-4">

                            <label
                                for="foundImage"
                                class="form-label"
                            >
                                Item Image
                                <span class="text-muted">
                                    (optional)
                                </span>
                            </label>

                            <input
                                type="file"
                                id="foundImage"
                                name="image"
                                class="form-control"
                                accept="image/png,image/jpeg,image/jpg,image/gif,image/webp"
                            >

                            <small class="text-muted">
                                Maximum size: 10 MB
                            </small>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-success w-100"
                        >
                            <i class="fa-solid fa-paper-plane me-2"></i>
                            Report Found Item
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</main>


<script src="js/app.js"></script>

</body>
</html>
