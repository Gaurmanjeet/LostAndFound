<!DOCTYPE html>
<html lang="en">
<head>

    <title>Lost Items | Lost & Found</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            <i class="fa-solid fa-magnifying-glass-location"></i>
            Lost<span>&</span>Found
        </a>

        <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="lost-items.html">
                        Lost Items
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="found-items.html">
                        Found Items
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="login.html">
                        Login
                    </a>
                </li>

            </ul>

        </div>

    </div>
</nav>


<section class="items-page">

    <div class="container">

        <div class="page-header">

            <div>
                <p class="page-label">LOST ITEMS</p>

                <h1>Items Reported Lost</h1>

                <p>
                    Browse items reported lost by users.
                </p>
            </div>

            <a href="report-lost.html" class="btn btn-primary">
                <i class="fa-solid fa-plus"></i>
                Report Lost Item
            </a>

        </div>


        <!-- SEARCH -->

        <div class="item-search">

            <div class="row g-2">

                <div class="col-md-5">

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </span>

                        <input
                            type="text"
                            class="form-control"
                            placeholder="Search lost items..."
                        >

                    </div>

                </div>


                <div class="col-md-3">

                    <select class="form-select">
                        <option>All Categories</option>
                        <option>Electronics</option>
                        <option>Documents</option>
                        <option>Wallet</option>
                        <option>Keys</option>
                        <option>Bag</option>
                    </select>

                </div>


                <div class="col-md-2">

                    <select class="form-select">
                        <option>All Locations</option>
                        <option>Hostel</option>
                        <option>Library</option>
                        <option>Canteen</option>
                        <option>Campus</option>
                    </select>

                </div>


                <div class="col-md-2">

                    <button class="btn btn-primary w-100">
                        Search
                    </button>

                </div>

            </div>

        </div>


        <!-- ITEMS -->

        <!-- ITEMS -->

<div class="row g-4 mt-3" id="lostItemsContainer">

    <div class="col-12 text-center py-5">
        <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
        <p class="mt-3">Loading lost items...</p>
    </div>

</div>

</section>


<footer>

    <div class="container text-center">

        <p class="mb-0">
            © 2026 Lost & Found System
        </p>

    </div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/app.js"></script>
