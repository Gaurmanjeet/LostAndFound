<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Found Items | Lost & Found</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar navbar-dark">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">

            <i class="fa-solid fa-magnifying-glass-location"></i>

            Lost<span>&</span>Found

        </a>

        <div>

            <a href="index.html"
               class="btn btn-outline-light me-2">
                Home
            </a>

            <a href="login.html"
               class="btn btn-light">
                Login
            </a>

        </div>

    </div>

</nav>


<section class="items-page">

    <div class="container">


        <!-- PAGE HEADER -->

        <div class="page-header">

            <div>

                <p class="page-label">
                    FOUND ITEMS
                </p>

                <h1>
                    Items Reported Found
                </h1>

                <p>
                    Browse items found by other users.
                </p>

            </div>


            <a href="report-found.html"
               class="btn btn-primary">

                <i class="fa-solid fa-plus"></i>

                Report Found Item

            </a>

        </div>


        <!-- SEARCH -->

        <div class="item-search">

            <div class="row g-2">

                <div class="col-md-5">

                    <input
                        type="text"
                        id="foundSearch"
                        class="form-control"
                        placeholder="Search found items...">

                </div>


                <div class="col-md-3">

                    <select
                        id="foundCategory"
                        class="form-select">

                        <option value="">
                            All Categories
                        </option>

                        <option value="Electronics">
                            Electronics
                        </option>

                        <option value="Documents">
                            Documents
                        </option>

                        <option value="Wallet">
                            Wallet
                        </option>

                        <option value="Keys">
                            Keys
                        </option>

                        <option value="Bag">
                            Bag
                        </option>

                    </select>

                </div>


                <div class="col-md-2">

                    <select
                        id="foundLocation"
                        class="form-select">

                        <option value="">
                            All Locations
                        </option>

                        <option value="Hostel">
                            Hostel
                        </option>

                        <option value="Library">
                            Library
                        </option>

                        <option value="Canteen">
                            Canteen
                        </option>

                        <option value="Campus">
                            Campus
                        </option>

                    </select>

                </div>


                <div class="col-md-2">

                    <button
                        id="foundSearchButton"
                        class="btn btn-primary w-100">

                        Search

                    </button>

                </div>

            </div>

        </div>


        <!-- REAL FOUND ITEMS -->

        <div
            class="row g-4 mt-3"
            id="foundItemsContainer">

            <div class="col-12 text-center py-5">

                <i class="fa-solid fa-spinner fa-spin fa-2x"></i>

                <p class="mt-3">
                    Loading found items...
                </p>

            </div>

        </div>


    </div>

</section>


<footer>

    <div class="container text-center">

        <p class="mb-0">
            © 2026 Lost & Found System
        </p>

    </div>

</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script src="js/app.js"></script>


</body>

</html>
