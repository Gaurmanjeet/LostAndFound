<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Item Details - Lost & Found</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<nav class="navbar navbar-expand-lg bg-white shadow-sm">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="index.html"
        >
            <i class="fa-solid fa-magnifying-glass-location me-2"></i>
            Lost & Found
        </a>


        <div>

            <a
                href="dashboard.html"
                class="btn btn-outline-primary me-2"
            >
                Dashboard
            </a>

            <a
                href="login.html"
                class="btn btn-outline-secondary"
            >
                Login
            </a>

        </div>

    </div>

</nav>


<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-9">

            <div class="card shadow-sm border-0">

                <div class="row g-0">

                    <div class="col-md-5">

                        <img
                            id="detailImage"
                            src=""
                            alt="Item image"
                            class="img-fluid rounded-start w-100"
                            style="
                                height: 100%;
                                min-height: 350px;
                                object-fit: cover;
                                display: none;
                            "
                        >

                        <div
                            id="noImagePlaceholder"
                            class="d-flex align-items-center justify-content-center bg-light"
                            style="
                                height: 100%;
                                min-height: 350px;
                            "
                        >

                            <div class="text-center text-muted">

                                <i class="fa-solid fa-image fa-4x mb-3"></i>

                                <p>
                                    No image available
                                </p>

                            </div>

                        </div>

                    </div>


                    <div class="col-md-7">

                        <div class="card-body p-4">

                            <div class="mb-3">

                                <span
                                    id="detailStatus"
                                    class="badge bg-primary"
                                >
                                    active
                                </span>

                            </div>


                            <h1
                                id="detailTitle"
                                class="fw-bold mb-3"
                            >
                                Loading...
                            </h1>


                            <p class="mb-2">

                                <strong>
                                    <i class="fa-solid fa-tag me-2"></i>
                                    Category:
                                </strong>

                                <span id="detailCategory">
                                    -
                                </span>

                            </p>


                            <p class="mb-2">

                                <strong>
                                    <i class="fa-solid fa-location-dot me-2"></i>
                                    Location:
                                </strong>

                                <span id="detailLocation">
                                    -
                                </span>

                            </p>


                            <p class="mb-2">

                                <strong>
                                    <i class="fa-solid fa-calendar me-2"></i>
                                    Date:
                                </strong>

                                <span id="detailDate">
                                    -
                                </span>

                            </p>


                            <p class="mb-4">

                                <strong>
                                    <i class="fa-solid fa-user me-2"></i>
                                    Reported by:
                                </strong>

                                <span id="detailReporter">
                                    -
                                </span>

                            </p>


                            <hr>


                            <h5 class="fw-bold mt-4">
                                Description
                            </h5>

                            <p
                                id="detailDescription"
                                class="text-muted"
                            >
                                Loading...
                            </p>


                            <div class="mt-4">

                                <button
                                    id="claimItemButton"
                                    class="btn btn-success w-100"
                                    style="display: none;"
                                >
                                    <i class="fa-solid fa-hand-holding-heart me-2"></i>
                                    Claim This Item
                                </button>

                            </div>


                            <div class="mt-3">

                                <a
                                    href="found-items.html"
                                    class="btn btn-outline-secondary w-100"
                                >
                                    <i class="fa-solid fa-arrow-left me-2"></i>
                                    Back to Found Items
                                </a>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>


<script src="js/app.js"></script>


<script>

    /*
     * Show / hide image placeholder.
     */

    const observer = new MutationObserver(() => {

        const image =
            document.getElementById("detailImage");

        const placeholder =
            document.getElementById(
                "noImagePlaceholder"
            );

        if (!image || !placeholder) {
            return;
        }

        if (
            image.style.display === "block" &&
            image.src
        ) {

            placeholder.style.display =
                "none";

        } else {

            placeholder.style.display =
                "flex";
        }

    });


    const imageElement =
        document.getElementById(
            "detailImage"
        );

    if (imageElement) {

        imageElement.addEventListener(
            "load",
            function () {

                const placeholder =
                    document.getElementById(
                        "noImagePlaceholder"
                    );

                if (placeholder) {
                    placeholder.style.display =
                        "none";
                }

            }
        );

        imageElement.addEventListener(
            "error",
            function () {

                this.style.display =
                    "none";

                const placeholder =
                    document.getElementById(
                        "noImagePlaceholder"
                    );

                if (placeholder) {
                    placeholder.style.display =
                        "flex";
                }

            }
        );
    }

</script>


</body>
</html>
