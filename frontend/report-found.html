<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Found Item | Lost & Found</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar navbar-dark">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">

            <i class="fa-solid fa-magnifying-glass-location"></i>

            Lost<span>&</span>Found

        </a>

        <a href="index.html" class="btn btn-outline-light">

            <i class="fa-solid fa-house"></i>

            Home

        </a>

    </div>

</nav>


<section class="report-page">

    <div class="container">

        <div class="report-header">

            <p class="page-label">
                REPORT ITEM
            </p>

            <h1>

                <i class="fa-solid fa-hand-holding-heart"></i>

                Report a Found Item

            </h1>

            <p>
                Help someone find their lost belongings.
            </p>

        </div>


        <div class="report-card">

            <form id="foundItemForm">


                <h4 class="form-section-title">

                    <i class="fa-solid fa-box"></i>

                    Item Information

                </h4>


                <div class="row g-4">


                    <div class="col-md-6">

                        <label class="form-label">
                            Item Name *
                        </label>

                        <input
                            type="text"
                            id="foundItemName"
                            class="form-control"
                            placeholder="e.g. Blue Backpack"
                            required
                        >

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Category *
                        </label>

                        <select
                            id="foundCategory"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select category
                            </option>

                            <option>Electronics</option>
                            <option>Documents</option>
                            <option>Wallet</option>
                            <option>Keys</option>
                            <option>Bag</option>
                            <option>Clothing</option>
                            <option>Jewellery</option>
                            <option>Other</option>

                        </select>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Date Found *
                        </label>

                        <input
                            type="date"
                            id="foundDate"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Approximate Time
                        </label>

                        <input
                            type="time"
                            id="foundTime"
                            class="form-control"
                        >

                    </div>


                    <div class="col-12">

                        <label class="form-label">
                            Description *
                        </label>

                        <textarea
                            id="foundDescription"
                            class="form-control"
                            rows="5"
                            placeholder="Describe the item, colour, brand, unique marks, etc."
                            required
                        ></textarea>

                    </div>


                    <div class="col-12">

                        <label class="form-label">
                            Item Image
                        </label>

                        <input
                            type="file"
                            id="foundImage"
                            class="form-control"
                            accept="image/*"
                        >

                        <small class="text-muted">
                            Upload a clear image if available.
                        </small>

                    </div>

                </div>


                <hr>


                <h4 class="form-section-title">

                    <i class="fa-solid fa-location-dot"></i>

                    Found Location

                </h4>


                <div class="row g-4">


                    <div class="col-md-6">

                        <label class="form-label">
                            Location *
                        </label>

                        <select
                            id="foundLocation"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select location
                            </option>

                            <option>College Campus</option>
                            <option>Library</option>
                            <option>Canteen</option>
                            <option>Hostel</option>
                            <option>Classroom</option>
                            <option>Laboratory</option>
                            <option>Auditorium</option>
                            <option>Main Gate</option>
                            <option>Other</option>

                        </select>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Specific Location
                        </label>

                        <input
                            type="text"
                            id="foundSpecificLocation"
                            class="form-control"
                            placeholder="e.g. Near Room 204"
                        >

                    </div>


                    <div class="col-12">

                        <label class="form-label">
                            Additional Details
                        </label>

                        <textarea
                            id="foundLocationDetails"
                            class="form-control"
                            rows="3"
                            placeholder="Provide any additional information..."
                        ></textarea>

                    </div>

                </div>


                <div class="form-actions">

                    <a
                        href="index.html"
                        class="btn btn-outline-secondary"
                    >
                        Cancel
                    </a>


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >

                        <i class="fa-solid fa-paper-plane"></i>

                        Submit Found Report

                    </button>

                </div>


            </form>

        </div>

    </div>

</section>


<footer>

    <div class="container text-center">

        <p class="mb-0">
            © 2026 Lost & Found System
        </p>

    </div>

</footer>


<script src="js/app.js"></script>

</body>
</html>
