<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lost Items | Lost & Found</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar navbar-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="index.html"
        >
            <i class="fa-solid fa-magnifying-glass-location"></i>
            Lost<span>&</span>Found
        </a>


        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
        >
            <span class="navbar-toggler-icon"></span>
        </button>


        <div
            class="collapse navbar-collapse"
            id="navbarNav"
        >

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="index.html"
                    >
                        Home
                    </a>
                </li>


                <li class="nav-item">
                    <a
                        class="nav-link active"
                        href="lost-items.html"
                    >
                        Lost Items
                    </a>
                </li>


                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="found-items.html"
                    >
                        Found Items
                    </a>
                </li>


                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="dashboard.html"
                    >
                        Dashboard
                    </a>
                </li>


                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="login.html"
                    >
                        Login
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>



<!-- =====================================================
     MAIN
===================================================== -->

<section class="items-page">

    <div class="container">


        <!-- HEADER -->

        <div class="page-header">

            <div>

                <p class="page-label">
                    LOST ITEMS
                </p>

                <h1>
                    Items Reported Lost
                </h1>

                <p>
                    Browse items reported lost by users.
                </p>

            </div>


            <a
                href="report-lost.html"
                class="btn btn-primary"
            >
                <i class="fa-solid fa-plus"></i>
                Report Lost Item
            </a>

        </div>



        <!-- =================================================
             SEARCH & FILTERS
        ================================================== -->

        <div class="item-search">

            <div class="row g-2">


                <!-- SEARCH -->

                <div class="col-md-5">

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="fa-solid fa-magnifying-glass"></i>

                        </span>


                        <input
                            type="text"
                            id="lostSearch"
                            class="form-control"
                            placeholder="Search lost items..."
                        >

                    </div>

                </div>



                <!-- CATEGORY -->

                <div class="col-md-3">

                    <select
                        id="lostCategory"
                        class="form-select"
                    >

                        <option value="">
                            All Categories
                        </option>

                        <option value="Electronics">
                            Electronics
                        </option>

                        <option value="Documents">
                            Documents
                        </option>

                        <option value="Wallet">
                            Wallet
                        </option>

                        <option value="Keys">
                            Keys
                        </option>

                        <option value="Bag">
                            Bag
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>



                <!-- LOCATION -->

                <div class="col-md-2">

                    <select
                        id="lostLocation"
                        class="form-select"
                    >

                        <option value="">
                            All Locations
                        </option>

                        <option value="Hostel">
                            Hostel
                        </option>

                        <option value="Library">
                            Library
                        </option>

                        <option value="Canteen">
                            Canteen
                        </option>

                        <option value="Campus">
                            Campus
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>



                <!-- SEARCH BUTTON -->

                <div class="col-md-2">

                    <button
                        type="button"
                        id="lostSearchButton"
                        class="btn btn-primary w-100"
                    >
                        <i class="fa-solid fa-search me-1"></i>
                        Search
                    </button>

                </div>

            </div>

        </div>



        <!-- =================================================
             ITEMS CONTAINER
        ================================================== -->

        <div
            class="row g-4 mt-3"
            id="lostItemsContainer"
        >

            <div class="col-12 text-center py-5">

                <i
                    class="fa-solid fa-spinner fa-spin fa-2x"
                ></i>

                <p class="mt-3">
                    Loading lost items...
                </p>

            </div>

        </div>


    </div>

</section>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    <div class="container text-center">

        <p class="mb-0">
            © 2026 Lost & Found System
        </p>

    </div>

</footer>



<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


<script src="js/app.js"></script>


</body>

</html>
