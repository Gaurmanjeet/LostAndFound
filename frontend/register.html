<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Lost & Found</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            <i class="fa-solid fa-magnifying-glass-location me-2"></i>
            Lost & Found
        </a>

        <div>
            <a href="login.html" class="btn btn-outline-primary">
                Login
            </a>
        </div>

    </div>
</nav>


<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <i class="fa-solid fa-user-plus fa-3x mb-3"></i>

                        <h2 class="fw-bold">
                            Create Account
                        </h2>

                        <p class="text-muted">
                            Join the Lost & Found community
                        </p>

                    </div>


                    <form id="registerForm">

                        <div class="mb-3">

                            <label
                                for="registerName"
                                class="form-label"
                            >
                                Full Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="registerName"
                                name="full_name"
                                placeholder="Enter your full name"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="registerEmail"
                                class="form-label"
                            >
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="registerEmail"
                                name="email"
                                placeholder="Enter your email"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="registerPassword"
                                class="form-label"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="registerPassword"
                                name="password"
                                placeholder="Minimum 6 characters"
                                minlength="6"
                                required
                            >

                        </div>


                        <div class="mb-4">

                            <label
                                for="confirmPassword"
                                class="form-label"
                            >
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="confirmPassword"
                                name="confirm_password"
                                placeholder="Enter password again"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            <i class="fa-solid fa-user-plus me-2"></i>
                            Create Account
                        </button>

                    </form>


                    <div class="text-center mt-4">

                        <span class="text-muted">
                            Already have an account?
                        </span>

                        <a href="login.html">
                            Login
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>


<script src="js/app.js"></script>

</body>
</html>
